# ==========================================
#  食光助手 · Nginx 配置
#  使用方法:
#   1. 替换 your-domain.com 为真实域名
#   2. 替换 SSL 证书路径为实际文件路径
#   3. 复制到 /etc/nginx/sites-available/aifood
#   4. ln -s /etc/nginx/sites-available/aifood /etc/nginx/sites-enabled/
#   5. nginx -t && nginx -s reload
# ==========================================

server {
    listen 80;
    server_name csyone.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name csyone.cn;

    ssl_certificate     /etc/nginx/ssl/csyone.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/csyone.cn.key;

    client_max_body_size 10m;
    proxy_buffering off;  # SSE 流式传输必须关闭缓冲

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
